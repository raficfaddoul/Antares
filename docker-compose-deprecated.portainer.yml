networks:
  AliantNetwork:

services:
  # This service creates ALL necessary directories first
  init-folders:
    image: alpine:latest
    user: root
    volumes:
      - /opt/aliant/data:/data
    command: >
      sh -c "
        mkdir -p /data/sql &&
        mkdir -p /data/images &&
        mkdir -p /data/influx &&
        mkdir -p /data/influx-config &&
        chown -R 10001:0 /data/sql &&
        chmod -R 755 /data &&
        echo '✅ All folders created and permissions set'
      "
    restart: "no"

  AliantDb:
    container_name: AliantDbContainer
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      init-folders:
        condition: service_completed_successfully
    ports:
      - "1433:1433"
    volumes:
      - /opt/aliant/data/sql:/var/opt/mssql/data
    environment:
      - ACCEPT_EULA=Y
      # The sa password comes from the stack's environment variables in Portainer (never from the repo).
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in the stack's environment variables}
      - MSSQL_PID=Developer
      - MSSQL_SSL_CERTIFICATE_CREATION=disabled
    networks:
      - AliantNetwork
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  aliant-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      AliantDb:
        condition: service_healthy
    user: root
    networks: 
      - AliantNetwork
    volumes:
      - /opt/aliant/data/sql:/var/opt/mssql/data
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in the stack's environment variables}
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo '📂 Checking for Antares files...';
        if [ -f /var/opt/mssql/data/Antares.mdf ]; then
          echo '✅ Database files found, attaching...';
          chown -R 10001:0 /var/opt/mssql/data;
          until /opt/mssql-tools18/bin/sqlcmd -S AliantDb -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q 'SELECT 1' >/dev/null 2>&1; do
            echo '   …waiting for SQL Server'; sleep 5;
          done
          /opt/mssql-tools18/bin/sqlcmd -S AliantDb -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "
            USE master;
            IF DB_ID('Antares') IS NULL
            CREATE DATABASE [Antares]
              ON (FILENAME='/var/opt/mssql/data/Antares.mdf'),
                 (FILENAME='/var/opt/mssql/data/Antares_log.ldf')
              FOR ATTACH;
            SELECT 'Antares attached successfully' AS Status;"
          echo '🏁 Antares attached';
        else
          echo '⚠️ No database files found - skipping attachment';
          echo 'Upload Antares.mdf and Antares_log.ldf to /opt/aliant/data/sql/ then restart this container';
        fi
    restart: "no"

  aliantwebs:
    container_name: AliantWebContainer
    image: raficfaddoul/antares:latest
    ports:
      - "8080:80"
    volumes:
      - /opt/aliant/data/images:/app/Images
    depends_on:
      init-folders:
        condition: service_completed_successfully
      AliantDb:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_HOST=AliantDb
      - DB_NAME=Antares
      - DB_SA_PASSWORD=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in the stack's environment variables}
      - MSSQL_SSL_CERTIFICATE_CREATION=disabled
      - BasePath=Aliant1  
      - API_URL=http://192.168.2.10:3001
      - SwanBrevoAPIKey=${SWAN_BREVO_API_KEY}
      - INFLUXDB_TOKEN=${INFLUXDB_ADMIN_TOKEN}      # ← InfluxService's token (no longer in the code)
    networks:
      - AliantNetwork

  influxdb2:
    image: influxdb:2
    container_name: InfluxDbContainer
    depends_on:
      init-folders:
        condition: service_completed_successfully
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
      DOCKER_INFLUXDB_INIT_ORG: Aliant
      DOCKER_INFLUXDB_INIT_BUCKET: AliantWebT
    volumes:
      - /opt/aliant/data/influx:/var/lib/influxdb2
      - /opt/aliant/data/influx-config:/etc/influxdb2
    networks:
      - AliantNetwork