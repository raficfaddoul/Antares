
networks:
  AliantNetwork:

services:
  # Add this service to fix ownership before AliantDb starts
  fix-permissions:
    image: alpine:latest
    user: root
    volumes:
      - ../data/sql/Aliant:/data
      - ../data/backups:/backups     # ← create & fix perms for backup folder too
    command: >
      sh -c "
        chown -R 10001:0 /data &&
        mkdir -p /backups &&
        chown -R 10001:0 /backups &&
        echo 'Ownership fixed for SQL Server'
      "
    restart: "no"

  AliantDb:
    container_name: AliantDbContainer
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      fix-permissions:
        condition: service_completed_successfully
    ports:
      - "8005:1433"
    volumes:
      - ../data/sql/Aliant:/var/opt/mssql/data
      - ../data/backups:/backups     # ← SMO writes the .bak here
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=password@12345#
      - MSSQL_PID=Developer
      - MSSQL_SSL_CERTIFICATE_CREATION=disabled
    networks:
      - AliantNetwork
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'password@12345#' -Q 'SELECT 1' -C"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  aliant-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      AliantDb:
        condition: service_healthy
    user: root
    networks:
      - AliantNetwork
    volumes:
      - ../data/sql/Aliant:/var/opt/mssql/data
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=password@12345#
    entrypoint:
      - /bin/bash
      - -e
      - -c
      - |
        echo '📂 Antares files'; ls -la /var/opt/mssql/data/Antares*;
        chown -R 10001:0 /var/opt/mssql/data;
        echo '⏳ Waiting for AliantDb…';
        until /opt/mssql-tools18/bin/sqlcmd -S AliantDb -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q 'SELECT 1' >/dev/null 2>&1; do
          echo '   …still starting'; sleep 5;
        done
        echo '✅ AliantDb is up';
        /opt/mssql-tools18/bin/sqlcmd -S AliantDb -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "
          USE master;
          IF DB_ID('Antares') IS NULL
          CREATE DATABASE [Antares]
            ON (FILENAME='/var/opt/mssql/data/Antares.mdf'),
               (FILENAME='/var/opt/mssql/data/Antares_log.ldf')
            FOR ATTACH;
          SELECT 'Antares attached successfully' AS Status;"
        echo '🏁 Antares attached';
    restart: "no"

  aliantwebs:
    container_name: AliantWebContainer
    image: ${DOCKER_REGISTRY-}aliantwebs
    build:
      context: .
      dockerfile: AliantWebS/Dockerfile
    ports: []
    volumes:
      - ../data/images:/app/Images
      - ../data/ScenariosData:/app/ScenariosData
      - ../data/backups:/backups     # ← app reads the .bak from here
    depends_on:
      AliantDb:
        condition: service_healthy
      aliant-db-init:
        condition: service_completed_successfully  # ← wait for DB attach to finish
    env_file:
      - .env.secrets
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTPS_PORT=
      - DB_HOST=AliantDb
      - DB_NAME=Antares
      - DB_SA_PASSWORD=password@12345#
      - MSSQL_SSL_CERTIFICATE_CREATION=disabled
      - BasePath=Aliant1
      - API_URL=http://172.17.0.1:8080
      - BackupPath=/backups          # ← tells Settings.razor where to read the .bak
      # Set here rather than only in appsettings so it still matches the bind mount below when
      # docker-compose.override.yml switches the environment to Development.
      - ScenariosDataPath=/app/ScenariosData
    networks:
      - AliantNetwork

  influxdb2:
    image: influxdb:2
    container_name: InfluxDbContainer
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME_FILE: /run/secrets/influxdb2-admin-username
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influxdb2-admin-password
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influxdb2-admin-token
      DOCKER_INFLUXDB_INIT_ORG: Aliant
      DOCKER_INFLUXDB_INIT_BUCKET: AliantWebT
    secrets:
      - influxdb2-admin-username
      - influxdb2-admin-password
      - influxdb2-admin-token
    volumes:
      - ../data/influx:/var/lib/influxdb2
      - ../data/influx-config:/etc/influxdb2  # ← was pointing to same path as data
    networks:
      - AliantNetwork

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - aliantwebs
    networks:
      - AliantNetwork

secrets:
  influxdb2-admin-username:
    file: .env.influxdb2-admin-username
  influxdb2-admin-password:
    file: .env.influxdb2-admin-password
  influxdb2-admin-token:
    file: .env.influxdb2-admin-token

volumes:
  sqlserver-data:
  backup-data:

